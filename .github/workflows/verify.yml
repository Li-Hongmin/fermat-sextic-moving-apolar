name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  sage:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a fresh working copy
        run: cp -r verification work && chmod -R a+rwX work
      - name: SageMath computations
        run: |
          docker run --rm -v "$PWD/work:/w" -w /w --entrypoint bash sagemath/sagemath:latest -lc "set -eo pipefail; echo '== First-order pencil' && sage calculations/bundles/aoki-sextic-second-order/aoki-sextic-pencil-first-order.sage && echo '== Second-order difference' && sage calculations/bundles/aoki-sextic-second-order/aoki-sextic-difference-second-order.sage && echo '== Sum jet to order six' && sage calculations/bundles/aoki-sextic-second-order/aoki-sextic-sum-order-six.sage && echo '== Moving apolar S2' && sage calculations/bundles/aoki-sextic-moving-apolar-s2/aoki-sextic-moving-apolar-s2.sage && echo '== Hilbert tangent at y0' && Y0_EXACT=1 sage calculations/bundles/aoki-sextic-y0-hilbert-tangent/aoki-y0-hilbert-tangent.sage && echo '== Singular: central union special fibre' && sage -singular -q calculations/bundles/aoki-sextic-ci-special-fiber/aoki-sextic-ci-special-fiber.sing < /dev/null"
